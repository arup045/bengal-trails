services:
  - type: web
    name: gobro-api
    env: node
    plan: free
    rootDir: backend
    buildCommand: npm install
    startCommand: npm run migrate && npm run seed && npm run seed:content && npm start
    healthCheckPath: /health
    envVars:
      - key: NODE_ENV
        value: production
      - key: JWT_SECRET
        generateValue: true
      - key: JWT_EXPIRES_IN
        value: 7d
      - key: FRONTEND_URL
        value: '*'
      - key: FIRST_ADMIN_EMAIL
        value: admin@gobro.com
      - key: PORT
        value: 3000

databases:
  - name: gobro-postgres
    plan: free
    databaseName: gobro
    user: gobro
