services:
  - type: web
    name: gobro-api
    env: node
    plan: free
    rootDir: backend
    buildCommand: npm install
    # ✅ Uses the graceful startup script — migrates DB then starts server.
    # Never fails the deploy even if DB already migrated or seed data exists.
    startCommand: npm run start:prod
    healthCheckPath: /health
    envVars:
      - key: NODE_ENV
        value: production
      - key: JWT_SECRET
        generateValue: true
      - key: JWT_EXPIRES_IN
        value: 7d
      # ⚠️  Replace * with your actual Vercel URL for proper CORS
      # IMPORTANT: Set FRONTEND_URL to your exact Vercel URL in Render Dashboard
      # e.g. https://bengal-trails.vercel.app
      # - key: FRONTEND_URL
      #   value: https://YOUR-APP.vercel.app
      - key: FIRST_ADMIN_EMAIL
        value: admin@bengaltrails.com
      # ⚠️ REQUIRED: Set a strong (12+ char) password in the Render dashboard.
      # Migration will FAIL in production if this is missing. Never commit a real value here.
      - key: FIRST_ADMIN_PASSWORD
        sync: false
      - key: PORT
        value: 3000

databases:
  - name: gobro-postgres
    plan: free
    databaseName: gobro
    user: gobro
