services:
  - type: web
    name: gobro-api
    env: node
    plan: free
    rootDir: backend
    buildCommand: npm install
    # ✅ Uses the graceful startup script — migrates DB then starts server.
    # Never fails the deploy even if DB already migrated or seed data exists.
    startCommand: npm run start:prod
    healthCheckPath: /health
    envVars:
      - key: NODE_ENV
        value: production
      - key: JWT_SECRET
        generateValue: true
      - key: JWT_EXPIRES_IN
        value: 7d
      # ⚠️  Replace * with your actual Vercel URL for proper CORS
      - key: FRONTEND_URL
        value: '*'
      - key: FIRST_ADMIN_EMAIL
        value: admin@bengaltrails.com
      - key: PORT
        value: 3000

databases:
  - name: gobro-postgres
    plan: free
    databaseName: gobro
    user: gobro
