<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="manifest" href="/manifest.json" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=5, viewport-fit=cover" />
    <meta name="theme-color" content="#9333ea" />

    <!-- Primary SEO -->
    <title>Bengal Trails — West Bengal Travel Guide | Destinations, Festivals, Food</title>
    <meta name="description" content="Discover 221+ destinations across West Bengal — from Darjeeling tea gardens to Sundarbans tigers. 100 festivals, authentic Bengali food, transport guides, and an AI travel assistant. Plan your trip with Bengal Trails." />
    <meta name="keywords" content="West Bengal travel, Darjeeling, Sundarbans, Kolkata tourism, Bengal festivals, Durga Puja, Poush Mela, Bengali food, Shantiniketan, Bishnupur, Cooch Behar, Bengal itinerary, North Bengal hills" />
    <meta name="author" content="Bengal Trails" />
    <link rel="canonical" href="https://bengaltrails.netlify.app/" />

    <!-- Open Graph (Facebook, WhatsApp, LinkedIn) -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Bengal Trails" />
    <meta property="og:title" content="Bengal Trails — West Bengal Travel Guide" />
    <meta property="og:description" content="221+ destinations, 100 festivals, authentic food, and AI-powered trip planning. Your complete guide to West Bengal." />
    <meta property="og:image" content="https://images.unsplash.com/photo-1626621341517-bbf3d9990a23?w=1200" />
    <meta property="og:url" content="https://bengaltrails.netlify.app/" />
    <meta property="og:locale" content="en_IN" />

    <!-- Twitter Card -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Bengal Trails — West Bengal Travel Guide" />
    <meta name="twitter:description" content="Discover 221+ destinations, 100 festivals, authentic Bengali food. Plan with AI." />
    <meta name="twitter:image" content="https://images.unsplash.com/photo-1626621341517-bbf3d9990a23?w=1200" />

    <!-- Robots -->
    <meta name="robots" content="index, follow, max-image-preview:large" />

    <!-- JSON-LD structured data: TravelAgency -->
    <script type="application/ld+json">
    {
      "@context": "https://schema.org",
      "@type": "TouristTripPlanner",
      "name": "Bengal Trails",
      "url": "https://bengaltrails.netlify.app/",
      "description": "West Bengal travel guide with 221 destinations, 100 festivals, food, transport, and AI trip planning.",
      "areaServed": {
        "@type": "AdministrativeArea",
        "name": "West Bengal",
        "containedInPlace": "India"
      }
    }
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>

</html>
