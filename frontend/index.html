<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="manifest" href="/manifest.json" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=5, viewport-fit=cover" />
    <meta name="theme-color" content="#9333ea" />

    <!-- Resource hints: warm up connections to the font + image CDNs and the API
         so the first font/image/data fetch skips DNS + TLS handshake latency. -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link rel="preconnect" href="https://res.cloudinary.com" />
    <link rel="preconnect" href="https://images.unsplash.com" />
    <link rel="preconnect" href="https://gobro-api.onrender.com" />
    <!-- LCP: preload the homepage hero so it starts downloading during HTML parse,
         before the JS bundle. Must match the <img> src in Hero.tsx (default hero). -->
    <link rel="preload" as="image" fetchpriority="high"
      href="https://images.unsplash.com/photo-1679418536818-7a7fb2db49bc?q=80&w=1600&auto=format&fit=crop" />
    <!-- Fonts loaded here (not via CSS @import) so the browser discovers them
         during HTML parse instead of after the CSS bundle downloads. -->
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Poppins:ital,wght@0,300;0,400;0,500;0,600;0,700;0,800;0,900;1,400;1,600&display=swap"
    />

    <!-- Primary SEO -->
    <title>Bengal Trails — West Bengal Travel Guide | Destinations, Festivals, Food</title>
    <meta name="description" content="Discover 250+ destinations across West Bengal — from Darjeeling tea gardens to Sundarbans tigers. 100 festivals, authentic Bengali food, transport guides, and an AI travel assistant. Plan your trip with Bengal Trails." />
    <meta name="keywords" content="West Bengal travel, Darjeeling, Sundarbans, Kolkata tourism, Bengal festivals, Durga Puja, Poush Mela, Bengali food, Shantiniketan, Bishnupur, Cooch Behar, Bengal itinerary, North Bengal hills" />
    <meta name="author" content="Bengal Trails" />
    <link rel="canonical" href="https://bengal-trails.vercel.app/" />

    <!-- Open Graph (Facebook, WhatsApp, LinkedIn) -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Bengal Trails" />
    <meta property="og:title" content="Bengal Trails — West Bengal Travel Guide" />
    <meta property="og:description" content="250+ destinations, 100 festivals, authentic food, and AI-powered trip planning. Your complete guide to West Bengal." />
    <meta property="og:image" content="https://images.unsplash.com/photo-1626621341517-bbf3d9990a23?w=1200" />
    <meta property="og:url" content="https://bengal-trails.vercel.app/" />
    <meta property="og:locale" content="en_IN" />

    <!-- Twitter Card -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Bengal Trails — West Bengal Travel Guide" />
    <meta name="twitter:description" content="Discover 250+ destinations, 100 festivals, authentic Bengali food. Plan with AI." />
    <meta name="twitter:image" content="https://images.unsplash.com/photo-1626621341517-bbf3d9990a23?w=1200" />

    <!-- Robots -->
    <meta name="robots" content="index, follow, max-image-preview:large" />

    <!-- JSON-LD structured data: TravelAgency -->
    <script type="application/ld+json">
    {
      "@context": "https://schema.org",
      "@type": "TouristTripPlanner",
      "name": "Bengal Trails",
      "url": "https://bengal-trails.vercel.app/",
      "description": "West Bengal travel guide with 250+ destinations, 100 festivals, food, transport, and AI trip planning.",
      "areaServed": {
        "@type": "AdministrativeArea",
        "name": "West Bengal",
        "containedInPlace": "India"
      }
    }
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
