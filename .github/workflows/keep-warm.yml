name: Keep backend warm

# The API runs on Render's free tier, which sleeps after ~15 min of inactivity.
# A cold wake-up takes 30–50s and makes pages (Food, Festivals, etc.) appear to
# "error" or load no data. This workflow pings the health endpoint on a schedule
# so the instance stays awake during the day, eliminating cold starts for users.
#
# Note: GitHub's scheduled runs are best-effort and can be delayed under load,
# but in practice this keeps the service warm well enough for a low-traffic site.

on:
  schedule:
    - cron: '*/5 * * * *'  # every 5 minutes (GitHub's minimum) to outrun Render's 15-min sleep
  workflow_dispatch: {}      # allow manual runs from the Actions tab

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping health + warm the DB pool
        run: |
          # /healthz wakes the web process; a real data endpoint warms the
          # Postgres connection pool so the first user query isn't slow either.
          h=$(curl -s -o /dev/null -w "%{http_code}" --max-time 90 https://gobro-api.onrender.com/healthz || echo "000")
          echo "healthz: $h"
          d=$(curl -s -o /dev/null -w "%{http_code}" --max-time 90 https://gobro-api.onrender.com/api/destinations?limit=1 || echo "000")
          echo "destinations: $d"
          # Never fail the job on a transient non-200 — the goal is just to keep it awake.
          exit 0
